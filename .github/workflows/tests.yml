name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Public repository: GitHub-hosted runners; action releases checked 2026-10-22.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (2026-07-20)
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-test.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/test_ui.cjs
      - run: swift build --package-path app -c release
        if: runner.os == 'macOS'
